name: Release OE Runtime

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release with notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md

  build-windows:
    needs: [create-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download canonical node.exe for SEA
        shell: pwsh
        run: |
          $ver = node --version
          $url = "https://nodejs.org/dist/$ver/win-x64/node.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\node-canonical.exe"
          echo "CANONICAL_NODE_EXE=$env:RUNNER_TEMP\node-canonical.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        working-directory: server
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build Windows runtime
        working-directory: server
        run: yarn build:win

      - name: Upload oe-runtime-win.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: server/cli/oe-runtime-win.exe

  build-linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: server
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build Linux runtime
        working-directory: server
        run: yarn build:linux

      - name: Generate Postman collection from samples
        working-directory: server
        run: yarn generate:postman

      - name: Zip sample library
        run: cd server/cli && zip -r oe-runtime-samples.zip samples/

      - name: Upload Linux binaries and starter files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            server/cli/oe-runtime-linux
            server/cli/oe-runtime.postman_collection.json
            server/cli/oe-runtime-samples.zip

  build-macos:
    needs: [create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: server
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build macOS runtime
        working-directory: server
        run: yarn build:macos

      - name: Upload oe-runtime-macos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: server/cli/oe-runtime-macos

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @openenthrium/oe-runtime to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-website:
    if: github.repository == 'enthrium/open-enthrium-ai-agent-runtime'
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Clone website repo
        run: git clone https://x-access-token:${{ secrets.WEBSITE_PAT }}@github.com/enthrium/open-enthrium-website.git website

      - name: Update version in runtime.html
        run: |
          VERSION="${{ github.ref_name }}"
          cd website
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/${VERSION}/g" runtime.html

      - name: Commit and push
        run: |
          VERSION="${{ github.ref_name }}"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runtime.html
          git diff --cached --quiet || git commit -m "chore: update OE Runtime download links to ${VERSION}"
          git push
