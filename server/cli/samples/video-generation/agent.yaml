name: Video Creator Agent
description: Generates a short teaching video on any topic — script, images, narration, and MP4 via Canva

params:
  - name: topic
    description: The topic or title of the video to create
    default: "How AI Agents Work"

connectors:
  - connection_name: OpenAI
    connection_type: restApi
  - connection_name: Canva
    connection_type: restApi

skills:
  - path: ./SKILL.md
    trigger_type: auto
